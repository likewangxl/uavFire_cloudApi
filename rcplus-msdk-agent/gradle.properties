org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
djiMsdkVersion=5.18.0
djiApiKey=e1d9602c193d8959dfc96604
agentBackendBaseUrl=http://192.168.0.100:81/
agentAiServiceBaseUrl=http://192.168.0.100:81/
agentMediaHost=192.168.0.100
agentMediaRtmpPort=8089
agentMediaStreamApp=live
# MQTT 复用 Windows HTTP 入口 81，由 Nginx /mqtt 反代到 Mosquitto WebSocket 8083。
agentMqttBrokerUrl=tcp://192.168.0.100:1883
# Optional development fallback only. Production identity is discovered from DJI MSDK.
agentAircraftSn=
# Optional development fallback only. Production identity is discovered from DJI MSDK.
agentGatewaySn=
# 当前 M300 飞行包固定启用 Agent 端可见光火情 ONNX 推理；仅回退包显式覆盖为 false。
agentFireOnnxEnabled=true
# 当前实飞配置固定使用 1088 模型，避免普通 assembleDebug 静默回退到 legacy416。
agentFireModelProfile=visible1088
# 单会话串行推理：4 个算子内线程匹配 RC Plus 的性能核心，图间并行固定为 1。
agentFireIntraOpThreads=4
agentFireInterOpThreads=1
ANDROID_COMPILE_SDK_VERSION=34
ANDROID_MIN_SDK_VERSION=26
ANDROID_TARGET_SDK_VERSION=34
KOTLIN_VERSION=2.1.21
