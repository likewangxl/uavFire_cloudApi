org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
djiMsdkVersion=5.18.0
djiApiKey=e1d9602c193d8959dfc96604
agentBackendBaseUrl=http://192.168.1.10:6789/
agentAiServiceBaseUrl=http://192.168.1.10:9000/
agentMediaHost=192.168.1.10
agentMediaRtmpPort=1935
agentMediaStreamApp=live
agentMqttBrokerUrl=tcp://192.168.1.10:1883
# Optional development fallback only. Production identity is discovered from DJI MSDK.
agentAircraftSn=
# Optional development fallback only. Production identity is discovered from DJI MSDK.
agentGatewaySn=
# Agent 端可见光火情 ONNX 推理；设为 false 可快速回退为仅推流。
agentFireOnnxEnabled=false
# 默认保留既有 416 模型；RC Plus 960 观察版构建时通过 -PagentFireModelProfile=visible960 显式切换。
agentFireModelProfile=legacy416
# 单会话串行推理：4 个算子内线程匹配 RC Plus 的性能核心，图间并行固定为 1。
agentFireIntraOpThreads=4
agentFireInterOpThreads=1
ANDROID_COMPILE_SDK_VERSION=34
ANDROID_MIN_SDK_VERSION=26
ANDROID_TARGET_SDK_VERSION=34
KOTLIN_VERSION=2.1.21
