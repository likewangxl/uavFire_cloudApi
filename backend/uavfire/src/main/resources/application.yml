livestream:
  playback:
    webrtc-host: ${LIVESTREAM_WEBRTC_HOST:localhost}
    webrtc-port: ${LIVESTREAM_WEBRTC_PORT:58925}
  url:
    # RTMP  Note: This IP is the address of the streaming server. If you want to see livestream on web page, you need to convert the RTMP stream to WebRTC stream.
    rtmp:
      url: ${LIVESTREAM_RTMP_URL:rtmp://localhost:1935/live/}  # Example: 'rtmp://192.168.1.1/live/'
    rtsp:
      username: test
      password: test
      port: 8554

    # GB28181 Note:If you don't know what these parameters mean, you can go to Pilot2 and select the GB28181 page in the cloud platform. Where the parameters same as these parameters.
    gb28181:
      serverIP: ${LIVESTREAM_GB28181_SERVER_IP:localhost}
      serverPort: 10001
      serverID: 1001
      agentID: 2001
      agentPassword: admin
      localPort: 10002
      channel: 1

    # Webrtc: Only supports using whip standard
    whip:
      url: ${LIVESTREAM_WHIP_URL:http://localhost:58925/index/api/whip?app=live&stream=}  # ZLMediaKit WHIP path on HTTP port; SRS template would be http://host:1985/rtc/v1/whip/?app=live&stream=

# ---------------------------------------------------------------------------
# fc100 灭火模块(合并自 fc100-backend,2026-05-15 feature/fc100-merge 分支)
# ---------------------------------------------------------------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:fc100-routes}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:9000}
  zlm-rtsp-host: ${AI_SERVICE_ZLM_RTSP_HOST:127.0.0.1}
  zlm-rtsp-port: ${AI_SERVICE_ZLM_RTSP_PORT:8554}
  auto-trigger-on-livestream: ${AI_SERVICE_AUTO_TRIGGER_ON_LIVESTREAM:true}
  auto-trigger-on-wayline: ${AI_SERVICE_AUTO_TRIGGER_ON_WAYLINE:true}

dual-stream:
  thermal-measurement-cooldown-ms: ${DUAL_STREAM_THERMAL_COOLDOWN_MS:5000}
  thermal-measurement-timeout-ms: ${DUAL_STREAM_THERMAL_TIMEOUT_MS:20000}

fc100:
  enabled: true
  fire-event:
    dedup-enabled: ${FIRE_EVENT_DEDUP_ENABLED:true}
    dedup-radius-m: ${FIRE_EVENT_DEDUP_RADIUS_M:40}
    dedup-active-window-ms: ${FIRE_EVENT_DEDUP_WINDOW_MS:1800000}
  thermal:
    saturation-temp-c: ${FC100_THERMAL_SATURATION_TEMP_C:540}
  release:
    controlled-test-auto-enabled: ${FC100_CONTROLLED_TEST_AUTO_ENABLED:false}
    # FC100 full-load hover budget is about 12 minutes; 5 minutes leaves return-home reserve.
    pending-timeout: ${FC100_RELEASE_PENDING_TIMEOUT:5m}
    pending-timeout-auto-return-enabled: ${FC100_RELEASE_PENDING_TIMEOUT_AUTO_RETURN_ENABLED:true}
  command-queue:
    max-retries: ${FC100_COMMAND_QUEUE_MAX_RETRIES:3}
    send-timeout: ${FC100_COMMAND_QUEUE_SEND_TIMEOUT:10s}
    ack-timeout: ${FC100_COMMAND_QUEUE_ACK_TIMEOUT:30s}
    retry-backoff: ${FC100_COMMAND_QUEUE_RETRY_BACKOFF:5s}
    dispatch-batch-size: ${FC100_COMMAND_QUEUE_DISPATCH_BATCH_SIZE:20}
  preflight:
    min-battery-pct: ${FC100_PREFLIGHT_MIN_BATTERY_PCT:30}
    max-wind-mps: ${FC100_PREFLIGHT_MAX_WIND_MPS:12}
    max-total-weight-kg: ${FC100_PREFLIGHT_MAX_TOTAL_WEIGHT_KG:85}
    max-net-payload-kg: ${FC100_PREFLIGHT_MAX_NET_PAYLOAD_KG:35}
    rules:
      R01: true
      R02: true
      R03: true
      R04: true
      R05: true
      R06: true
      R07: true
      R08: true
      R09: true
      R10: true
      R11: true
      R12: true
      R13: true
      R14: true
      R15: true
    time-budget:
      cruise-speed-mps: ${FC100_PREFLIGHT_TIME_BUDGET_CRUISE_SPEED_MPS:8}
      max-flight-minutes: ${FC100_PREFLIGHT_TIME_BUDGET_MAX_FLIGHT_MINUTES:40}
      hover-minutes: ${FC100_PREFLIGHT_TIME_BUDGET_HOVER_MINUTES:12}
      hover-ratio: ${FC100_PREFLIGHT_TIME_BUDGET_HOVER_RATIO:1.0}
      safety-reserve-ratio: ${FC100_PREFLIGHT_TIME_BUDGET_SAFETY_RESERVE_RATIO:0.2}
  delivery-sync:
    mode: mock                # mock | http
    base-url: https://ta-api.dji.com
    ak: ${FC100_DELIVERY_SYNC_AK:}
    sk: ${FC100_DELIVERY_SYNC_SK:}
    group-id: ${FC100_DELIVERY_SYNC_GROUP_ID:}
    workspace-id: ${FC100_DELIVERY_SYNC_WORKSPACE_ID:DEFAULT}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
    retry:
      max-attempts: 3
      backoff-ms: [500, 1500, 4500]
  safety:
    four-eyes-enabled: false
    wind-speed-error-threshold: 10
    wind-speed-warn-threshold: 6
    payload-weight-max-kg: 82
  waypoint:
    default-cruise-speed: 5
    max-route-length-m: 8000
    max-distance-from-takeoff-m: 5000
    # 测试用：放大短航线阈值=最大距离，使航线恒为两航点(起飞→投放)，到点 finishAction=noAction
    # 原地悬停后由投放命令脱钩。生产环境恢复完整剖面请改回 300。
    short-route-max-distance-m: 5000
    drop-altitude-agl-m: 30
    drift-coefficient: 0.4
    max-drop-offset-m: 30
  route:
    file-storage: local              # local | minio
    local-dir: /tmp/fc100-routes
    wpml-version: 1.0.6
    default-drone-enum-value: 100
    default-payload-enum-value: 99
    take-off-security-height: 20
    global-transitional-speed: 15

# DEM 地形高程（Copernicus GLO-30 转 .hgt，见 scripts/fetch-dem.sh）。
# 配置 dem-dir 后 HgtTerrainElevationService 生效；不配置则回落 MissingTerrainElevationService。
uavfire:
  terrain:
    dem-dir: ${UAVFIRE_DEM_DIR:data/dem}
