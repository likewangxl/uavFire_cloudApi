server:
  port: 6789
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      pattern: '%h %l %u %t "%r" %s %b %D'
      prefix: access
      suffix: .log
spring:
  config:
    import: optional:classpath:application-fc100-local.yml
  main:
    allow-bean-definition-overriding: true
  application:
    name: cloud-api-sample
  mvc:
    log-request-details: false
  datasource:
    druid:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.50.254:3306/cloud_sample?useSSL=false&allowPublicKeyRetrieval=true
      username: g_byzt
      password: g_byzt
      initial-size: 10
      min-idle: 10
      max-active: 20
      max-wait: 60000

  redis:
    host: localhost
    port: 6379
    database: 0
    username: # if you enable
    password:
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

jwt:
  issuer: DJI
  subject: CloudApiSample
  secret: CloudApiSample
  age: 86400

mqtt:
  # @see com.yx.uavfire.component.mqtt.model.MqttUseEnum
  # BASIC parameters are required.
  BASIC:
    protocol: MQTT # @see com.yx.uavfire.component.mqtt.model.MqttProtocolEnum
    host: 192.168.50.200
    port: 1883
    username: JavaServer
    password: 123456
    client-id: 123456
    # If the protocol is ws/wss, this value is required.
    path:
  DRC:
    protocol: WS # @see com.yx.uavfire.component.mqtt.model.MqttProtocolEnum
    host: 192.168.50.200
    port: 8083
    path: /mqtt
    username: JavaServer
    password: 123456

cloud-sdk:
  mqtt:
    # Topics that need to be subscribed when initially connecting to mqtt, multiple topics are divided by ",".
    inbound-topic: sys/product/+/status,thing/product/+/requests

url:
  manage:
    prefix: manage
    version: /api/v1
  map:
    prefix: map
    version: /api/v1
  media:
    prefix: media
    version: /api/v1
  wayline:
    prefix: wayline
    version: /api/v1
  wayline-agent:
    prefix: wayline-agent
    version: /api/v1
  control:
    prefix: control
    version: /api/v1

wayline-agent:
  shared-secret: change-me-in-production
  token-ttl-seconds: 86400
  server-url: http://192.168.50.200:6789
  mqtt:
    event-topic: uavfire/agent/+/events/#
  storage:
    prefix: storage
    version: /api/v1

# Tutorial: https://www.alibabacloud.com/help/en/object-storage-service/latest/use-a-temporary-credential-provided-by-sts-to-access-oss
