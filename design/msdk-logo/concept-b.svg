<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bladeB" cx="0.5" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ff2d1f"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bgB)"/>
  <circle cx="512" cy="512" r="320" fill="url(#glowB)"/>

  <!-- propeller guard ring -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#cdd9e8" stroke-width="10" opacity="0.28"/>

  <!-- three flame blades (pinwheel) -->
  <g fill="url(#bladeB)">
    <g transform="rotate(0 512 512)">
      <path d="M512 512 C 468 432 452 322 520 214 C 548 318 566 430 512 512 Z"/>
    </g>
    <g transform="rotate(120 512 512)">
      <path d="M512 512 C 468 432 452 322 520 214 C 548 318 566 430 512 512 Z"/>
    </g>
    <g transform="rotate(240 512 512)">
      <path d="M512 512 C 468 432 452 322 520 214 C 548 318 566 430 512 512 Z"/>
    </g>
  </g>

  <!-- motor hub -->
  <circle cx="512" cy="512" r="86" fill="#0a0e16" stroke="#cdd9e8" stroke-width="14"/>
  <circle cx="512" cy="512" r="30" fill="#e9f1fb"/>
</svg>
