<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2d1f"/>
      <stop offset="0.5" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="flameInA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
    <g id="motorA">
      <circle r="92" fill="none" stroke="#e9f1fb" stroke-width="16"/>
      <g opacity="0.38" fill="#e9f1fb">
        <ellipse rx="78" ry="15" transform="rotate(35)"/>
        <ellipse rx="78" ry="15" transform="rotate(-35)"/>
      </g>
      <circle r="18" fill="#e9f1fb"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bgA)"/>

  <!-- fire glow -->
  <circle cx="512" cy="512" r="300" fill="url(#glowA)"/>

  <!-- arms (X frame) -->
  <g stroke="#cdd9e8" stroke-width="36" stroke-linecap="round">
    <line x1="512" y1="512" x2="305" y2="305"/>
    <line x1="512" y1="512" x2="719" y2="305"/>
    <line x1="512" y1="512" x2="305" y2="719"/>
    <line x1="512" y1="512" x2="719" y2="719"/>
  </g>

  <!-- motors -->
  <use href="#motorA" transform="translate(305,305)"/>
  <use href="#motorA" transform="translate(719,305)"/>
  <use href="#motorA" transform="translate(305,719)"/>
  <use href="#motorA" transform="translate(719,719)"/>

  <!-- central body -->
  <circle cx="512" cy="512" r="132" fill="#0a0e16" stroke="#cdd9e8" stroke-width="14"/>

  <!-- flame core -->
  <path fill="url(#flameA)" d="M512 626
    C 452 596 446 512 488 456
    C 496 488 516 492 516 466
    C 516 420 552 408 566 452
    C 590 502 582 596 512 626 Z"/>
  <path fill="url(#flameInA)" d="M512 596
    C 478 576 476 524 500 492
    C 506 514 520 516 520 498
    C 522 530 544 556 522 584
    C 518 592 516 594 512 596 Z"/>
</svg>
