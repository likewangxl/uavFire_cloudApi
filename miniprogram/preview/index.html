<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小程序布局与交互检查</title>
<style>body{margin:0;background:#eef0f3;color:#262b32;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 28px;background:#fff;border-bottom:1px solid #dce0e5}h1{font-size:20px;margin:0 0 10px}p{margin:0;color:#616873;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}label{display:flex;gap:8px;align-items:center}select,button{font:inherit;background:#fff;border:1px solid #bdc5ce;border-radius:8px;padding:10px}main{padding:24px;display:flex;justify-content:center;align-items:flex-start}iframe{height:844px;border:1px solid #cbd1d9;border-radius:18px;background:#fff;box-shadow:0 8px 32px #14223212}footer{padding:0 28px 24px;text-align:center;color:#616873}</style>
<header><h1>小程序布局与交互检查</h1><p>复用当前 WXML、WXSS 和页面交互代码。使用本地测试数据，包含长编号、长名称、空列表和网络失败；微信导航栏、选择器与开关由浏览器模拟。</p>
<nav><label>屏幕宽度<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select></label><label>检查页面<select id="screen"><option value="home">首页</option><option value="tasks">任务</option><option value="events">态势</option><option value="reports">报告</option><option value="mine">我的</option><option value="task-detail">任务详情</option><option value="event-detail">火情详情</option><option value="report-detail">报告详情</option></select></label><label>测试状态<select id="scenario"><option value="normal">正常与长文本</option><option value="empty">空列表 / 未记录</option><option value="partial">部分飞行记录</option><option value="error">网络失败</option><option value="logged-out">未登录</option><option value="binding">待绑定</option><option value="pending">待审核</option></select></label><button id="reset">重新载入</button></nav></header>
<main><iframe id="phone" title="小程序预览" style="width:390px" src="/device?screen=home&scenario=normal"></iframe></main><footer>这是布局与交互检查环境，不连接生产接口，也不签发真实微信凭证。</footer>
<script>const frame=document.querySelector('#phone');const reload=()=>{frame.style.width=document.querySelector('#width').value+'px';frame.src='/device?screen='+document.querySelector('#screen').value+'&scenario='+document.querySelector('#scenario').value};document.querySelector('#width').onchange=()=>{frame.style.width=document.querySelector('#width').value+'px'};document.querySelector('#screen').onchange=reload;document.querySelector('#scenario').onchange=reload;document.querySelector('#reset').onclick=reload;</script></html>
