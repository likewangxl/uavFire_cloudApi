<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小程序预览</title>
<style>html,body{height:100%;margin:0;background:#fff}body{display:grid;grid-template-rows:66px minmax(0,1fr) auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20242a}#native-nav{display:flex;align-items:center;justify-content:center;position:relative;padding-top:12px;border-bottom:1px solid #f0f1f4;font-size:16px;font-weight:600;background:#fff}#native-nav button{position:absolute;left:12px;top:12px;border:0;padding:10px;background:transparent;font-size:14px}#surface{min-height:0;overflow:auto;position:relative;background:#fff}#native-tabs{display:flex;min-height:62px;padding-bottom:12px;border-top:1px solid #e4e7eb;background:#fff}#native-tabs button{flex:1;min-width:0;border:0;border-radius:0;padding:12px 0;background:#fff;color:#707782;font-size:14px;font-weight:400}#native-tabs button.active{color:#007aff;font-weight:650}#toast{position:fixed;bottom:92px;left:20px;right:20px;background:#303741;color:white;padding:12px;border-radius:8px;text-align:center;display:none;z-index:10}.picker-preview{position:relative}.picker-preview select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.wx-switch-preview{appearance:auto;width:44px;height:28px;accent-color:#454d58;flex-shrink:0}wx-label{display:block}#surface .wx-text{white-space:pre-line}#surface .wx-block{display:contents}#surface input{font-family:inherit}#surface button{font-family:inherit;cursor:pointer}</style>
<style>[hidden]{display:none!important}#surface{scrollbar-width:none}#surface::-webkit-scrollbar{width:0;height:0}</style><style id="page-style"></style><header id="native-nav"><button id="back" hidden>返回</button><span id="nav-title">小程序</span></header><main id="surface" aria-label="页面内容"></main><nav id="native-tabs" aria-label="主导航"></nav><div id="toast" role="status"></div><script src="/compiled.js"></script><script type="module" src="/renderer.js"></script></html>
